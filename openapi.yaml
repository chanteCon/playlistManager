  /api/users/update-email:
    patch:
      summary: User update email
      description: |-
        Sends new verification code to provided email address, 
                    resets user to unverified state. Verify at /api/auth/verify
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: new@email.com.au
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                  description: User email address, must be valid and unique
                  example: user@example.com
              required:
                - email
