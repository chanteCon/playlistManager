                  - message
                  - data
                additionalProperties: false
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                success: false
                data: null
                message: Unauthorized
                errors: null
              schema:
                type: object
                properties:
                  success:
                    type: boolean
