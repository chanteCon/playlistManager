  /api/users/{id}:
    get:
      summary: Get user by ID
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            example: 00000000-0000-0000-0000-000000000000
          description: User ID
      responses:
        "200":
          description: User retrieved
          content:
            application/json:
              example:
                success: true
                data:
                  user:
                    username: User_name123
                    id: 00000000-0000-0000-0000-000000000000
                message: User retrieved
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    type: string
                    example: User retrieved
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                            description: The unique ID of the user
                            example: 00000000-0000-0000-0000-000000000000
                          username:
                            description: Username must be unique and between 5 and 30 characters. Can only
                              contain letters, numbers, dots, underscores, and
                              hyphens
                            example: User_name123
                        required:
                          - id
                          - username
                        additionalProperties: false
                    required:
                      - user
                    additionalProperties: false
                required:
                  - success
                  - message
                  - data
                additionalProperties: false
