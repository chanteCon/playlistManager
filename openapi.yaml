          application/json:
            example:
              code: "123"
              password: newPassword123!$
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  description: Six character verification code, expires in 5 minutes
                  example: 21923c
                password:
                  type: string
                  minLength: 6
                  maxLength: 128
                  pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=[\]{};':"\\|,.<>/?])[a-zA-Z0-9!@#$%^&*()_+\-=[\]{};':"\\|,.<>/?]{6,}$
                  description: Password must be 6-128 characters with uppercase, lowercase,
                    number, and symbol
                  example: Aa1!xyz
              required:
                - code
                - password
      responses:
        "200":
          description: Password successfully reset
          content:
            application/json:
              example:
                success: true
                data: {}
                message: Password successfully reset
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    type: string
                    example: Password successfully reset
                  data:
                    example: {}
