      summary: User logout
      description: Clears refresh cookie on logout
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Successfully logged out.
          content:
            application/json:
              example:
                success: true
                data: {}
                message: Successfully logged out.
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    type: string
                    example: Successfully logged out.
                  data:
                    example: {}
                required:
