  /api/users/me:
    get:
      summary: Get authenticated user
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              example:
                success: true
                data:
                  user:
                    email: user@example.com
                    username: User_name123
                    id: 00000000-0000-0000-0000-000000000000
                message: null
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    anyOf:
                      - type: string
                      - type: "null"
                    example: null
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                            description: The unique ID of the user
                            example: 00000000-0000-0000-0000-000000000000
                          username:
                            description: Username must be unique and between 5 and 30 characters. Can only
                              contain letters, numbers, dots, underscores, and
                              hyphens
                            example: User_name123
                          email:
                            type: string
                            format: email
                            pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                            description: User email address, must be valid and unique
                            example: user@example.com
                        required:
                          - id
                          - username
                          - email
                        additionalProperties: false
                    required:
                      - user
                    additionalProperties: false
                required:
                  - success
                  - message
                  - data
                additionalProperties: false
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                success: false
                data: null
                message: Unauthorized
                errors: null
              schema:
                type: object
                properties:
                  success:
                    type: boolean
