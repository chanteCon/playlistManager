                  example: user@example.com
              required:
                - email
      responses:
        "200":
          description: If email is valid you will receive a code
          content:
            application/json:
              example:
                success: true
                data: {}
                message: If email is valid you will receive a code
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    type: string
                    example: If email is valid you will receive a code
                  data:
                    example: {}
                required:
                  - success
                  - message
                  - data
                additionalProperties: false
        "400":
          description: Invalid Input
          content:
            application/json:
              example:
                success: false
                data: null
                message: Invalid Input
                errors:
                  email:
                    - Invalid email address
              schema:
