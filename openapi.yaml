                  type: string
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                  description: User email address, must be valid and unique
                  example: user@example.com
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "200":
          description: If email is valid you will receive a login code
          content:
            application/json:
              example:
                success: true
                data: {}
                message: If email is valid you will receive a login code
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    type: string
                    example: If email is valid you will receive a login code
                  data:
                    example: {}
                required:
                  - success
                  - message
                  - data
                additionalProperties: false
        "400":
          description: Invalid input
          content:
            application/json:
              example:
                success: false
                data: null
                message: Invalid input
                errors:
                  email:
                    - Invalid email address
                  password:
                    - Password must be a string
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: false
                  message:
                    default: Invalid input
                    type: string
                  data:
                    type: "null"
                  errors:
                    anyOf:
                      - type: object
                        propertyNames:
                          type: string
                        additionalProperties:
                          type: array
                          items:
                            type: string
                      - type: "null"
                required:
                  - success
                  - message
                  - data
                additionalProperties: false
        "401":
          description: Incorrect email or password
          content:
            application/json:
              example:
                success: false
                data: null
                message: Incorrect email or password
                errors: null
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: false
                  message:
                    default: Incorrect email or password
                    type: string
                  data:
                    type: "null"
                  errors:
                    anyOf:
                      - type: object
                        propertyNames:
                          type: string
                        additionalProperties:
                          type: array
                          items:
                            type: string
                      - type: "null"
                required:
                  - success
                  - message
                  - data
                additionalProperties: false
