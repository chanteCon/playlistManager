openapi: 3.1.0
info:
  title: Playlist Manager API
  version: 1.0.0
  description: >-
    Playlist Manager is an API for managing users, playlists, and video
    collections.
        It provides authentication, playlist management, and video integration features.
        Requests are rate limited .
servers:
  - url: http://localhost:4000
    description: Main API server
paths:
  /api/auth/register:
    post:
      summary: Register a new user
      description: Creates a new user account and sends a verification code to user.
        Verify email at api/auth/verify.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: user@example.com
              password: Aa1!xyz
              username: User_name123
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                  description: User email address, must be valid and unique
                  example: user@example.com
                password:
                  type: string
                  minLength: 6
                  maxLength: 128
                  pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=[\]{};':"\\|,.<>/?])[a-zA-Z0-9!@#$%^&*()_+\-=[\]{};':"\\|,.<>/?]{6,}$
                  description: Password must be 6-128 characters with uppercase, lowercase,
                    number, and symbol
                  example: Aa1!xyz
                username:
                  description: Username must be unique and between 5 and 30 characters. Can only
                    contain letters, numbers, dots, underscores, and hyphens
                  example: User_name123
                  type: string
                  minLength: 5
                  maxLength: 30
                  pattern: ^[a-zA-Z0-9._-]+$
              required:
                - email
                - password
                - username
      responses:
        "201":
          description: A code has been sent to the provided email address. Please verify
            email to continue.
          content:
            application/json:
              example:
                success: true
                data: {}
                message: A code has been sent to the provided email address. Please verify email
                  to continue.
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    type: string
                    example: A code has been sent to the provided email address. Please verify email
                      to continue.
                  data:
                    example: {}
                required:
                  - success
                  - message
                  - data
                additionalProperties: false
        "400":
          description: Invalid input
          content:
            application/json:
              example:
                success: false
                data: null
                message: Invalid input
                errors:
                  email:
                    - Invalid email address
                  username:
                    - Username must be at least 5 characters
                  password:
                    - Password must contain uppercase, lowercase, number, and
                      symbol, and no invalid characters
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: false
                  message:
                    default: Invalid input
                    type: string
                  data:
                    type: "null"
                  errors:
                    anyOf:
                      - type: object
                        propertyNames:
                          type: string
                        additionalProperties:
                          type: array
                          items:
                            type: string
                      - type: "null"
                required:
                  - success
                  - message
                  - data
                additionalProperties: false
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: false
                  message:
                    default: Conflict
                    type: string
                  data:
                    type: "null"
                  errors:
                    anyOf:
                      - type: object
                        propertyNames:
                          type: string
                        additionalProperties:
                          type: array
                          items:
                            type: string
                      - type: "null"
                required:
                  - success
                  - message
                  - data
                additionalProperties: false
              examples:
                emailAlreadyInUse:
                  summary: Email already in use
                  value:
                    success: false
                    data: null
                    message: Email already in use
                    errors:
                      email:
                        - Email already in use
                usernameAlreadyInUse:
                  summary: Username already in use
                  value:
                    success: false
                    data: null
                    message: Username already in use
                    errors:
                      username:
                        - Username already in use
  /api/auth/verify:
    patch:
      summary: User verifies email address
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            example:
              code: "123"
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  description: Six character verification code, expires in 5 minutes
                  example: 21923c
              required:
                - code
      responses:
        "200":
          description: Successful response
          headers:
            Set-Cookie:
              description: Refresh token cookie, expires in 7 days
              schema:
                type: string
          content:
            application/json:
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                message: null
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    anyOf:
                      - type: string
                      - type: "null"
                    example: null
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        description: Access token, expires in 30 minutes
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                    required:
                      - accessToken
                    additionalProperties: false
                required:
                  - success
                  - message
                  - data
                additionalProperties: false
        "400":
          description: Invalid Input
          content:
            application/json:
              example:
                success: false
                data: null
                message: Invalid Input
                errors:
                  code:
                    - "Too small: expected string to have >=6 characters"
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: false
                  message:
                    default: Invalid Input
                    type: string
                  data:
                    type: "null"
                  errors:
                    anyOf:
                      - type: object
                        propertyNames:
                          type: string
                        additionalProperties:
                          type: array
                          items:
                            type: string
                      - type: "null"
                required:
                  - success
                  - message
                  - data
                additionalProperties: false
        "401":
          description: Could not verify verification code
          content:
            application/json:
              example:
                success: false
                data: null
                message: Could not verify verification code
                errors:
                  code:
                    - Invalid or expired verification code
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: false
                  message:
                    default: Could not verify verification code
                    type: string
                  data:
                    type: "null"
                  errors:
                    anyOf:
                      - type: object
                        propertyNames:
                          type: string
                        additionalProperties:
                          type: array
                          items:
                            type: string
                      - type: "null"
                required:
                  - success
                  - message
                  - data
                additionalProperties: false
  /api/auth/login:
    post:
      summary: User login
      description: Sends a verification code for login to user email
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: user@example.com
              password: Aa1!xyz
            schema:
              type: object
              properties:
