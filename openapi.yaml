        "400":
          description: Invalid Input
          content:
            application/json:
              example:
                success: false
                data: null
                message: Invalid Input
                errors:
                  code:
                    - "Too small: expected string to have >=6 characters"
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: false
                  message:
                    default: Invalid Input
