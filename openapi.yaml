  /api/auth/refresh:
    post:
      summary: Refresh access token
      description: Issues new access token and refresh token
        cookie.             Refresh token cookie must be included in the
        request. User must be             verified. Generic 401 error if token
        invalid or user not verified.
      tags:
        - Auth
      responses:
        "200":
          description: Successful response
          headers:
            Set-Cookie:
              description: Refresh token cookie, expires in 7 days
              schema:
                type: string
          content:
            application/json:
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                message: null
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    anyOf:
                      - type: string
                      - type: "null"
                    example: null
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        description: Access token, expires in 30 minutes
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                    required:
                      - accessToken
                    additionalProperties: false
                required:
                  - success
                  - message
                  - data
                additionalProperties: false
        "401":
          description: Invalid token
          content:
            application/json:
              example:
                success: false
                data: null
                message: Invalid token
                errors: null
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: false
                  message:
                    default: Invalid token
                    type: string
                  data:
                    type: "null"
                  errors:
