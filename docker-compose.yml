services:
    db:
        image: postgres:16
        restart: always
        container_name: postgres-db
        ports:
            - '${DB_PORT}:5432'
        volumes:
            - sql_data:/var/lib/postgresql/data
        env_file:
            - ${ENV_FILE:-.env}
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: my_db

    cache:
        image: redis:7
        container_name: redis-cache
        ports:
            - '6379:6379'

    mailhog:
        image: mailhog/mailhog
        ports:
            - '1025:1025'
            - '8025:8025'

volumes:
    sql_data:
